<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建新相册 - 幼儿成长记录系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .required {
            color: #e53935;
        }
        
        .optional {
            color: #999;
            font-weight: normal;
        }
        
        .album-suggestions {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .album-suggestions h4 {
            margin-bottom: 10px;
            color: #667eea;
        }
        
        .suggestion-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }
        
        .suggestion-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            cursor: pointer;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .suggestion-item:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/albums/{{ baby.id }}" class="back-btn">← 返回相册列表</a>
        
        <div class="header">
            <h1>📷 创建新相册</h1>
            <p>为 {{ baby.name }} 创建一个新的相册</p>
        </div>
        
        <div class="form-card">
            <div class="album-suggestions">
                <h4>💡 常用相册名称（点击快速选择）</h4>
                <div class="suggestion-grid">
                    <div class="suggestion-item" onclick="selectAlbum('出生纪念')">出生纪念</div>
                    <div class="suggestion-item" onclick="selectAlbum('满月照')">满月照</div>
                    <div class="suggestion-item" onclick="selectAlbum('百天照')">百天照</div>
                    <div class="suggestion-item" onclick="selectAlbum('半岁照')">半岁照</div>
                    <div class="suggestion-item" onclick="selectAlbum('周岁照')">周岁照</div>
                    <div class="suggestion-item" onclick="selectAlbum('日常生活')">日常生活</div>
                    <div class="suggestion-item" onclick="selectAlbum('外出游玩')">外出游玩</div>
                    <div class="suggestion-item" onclick="selectAlbum('家庭聚会')">家庭聚会</div>
                </div>
            </div>
            
            <form action="/album/add/{{ baby.id }}" method="post">
                <div class="form-group">
                    <label for="name">相册名称 <span class="required">*</span></label>
                    <input type="text" id="name" name="name" required placeholder="例如：满月照、日常生活、外出游玩">
                </div>
                
                <div class="form-group">
                    <label for="description">相册描述 <span class="optional">(选填)</span></label>
                    <textarea id="description" name="description" placeholder="描述这个相册的内容..."></textarea>
                </div>
                
                <div class="btn-group">
                    <a href="/albums/{{ baby.id }}" class="btn btn-secondary">取消</a>
                    <button type="submit" class="btn btn-primary">创建相册</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        function selectAlbum(name) {
            document.getElementById('name').value = name;
        }
    </script>
</body>
</html>
