<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记录疫苗接种 - 幼儿成长记录系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .required {
            color: #e53935;
        }
        
        .optional {
            color: #999;
            font-weight: normal;
        }
        
        .vaccine-suggestions {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .vaccine-suggestions h4 {
            margin-bottom: 10px;
            color: #667eea;
        }
        
        .suggestion-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .suggestion-tag {
            background: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            cursor: pointer;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .suggestion-tag:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/baby/{{ baby.id }}" class="back-btn">← 返回宝宝详情</a>
        
        <div class="header">
            <h1>💉 记录疫苗接种</h1>
            <p>为 {{ baby.name }} 记录疫苗接种情况</p>
        </div>
        
        <div class="form-card">
            <div class="vaccine-suggestions">
                <h4>💡 常用疫苗（点击快速选择）</h4>
                <div class="suggestion-tags" id="vaccineTags">
                    <span class="suggestion-tag" onclick="selectVaccine('乙肝疫苗')">乙肝疫苗</span>
                    <span class="suggestion-tag" onclick="selectVaccine('卡介苗')">卡介苗</span>
                    <span class="suggestion-tag" onclick="selectVaccine('脊灰疫苗')">脊灰疫苗</span>
                    <span class="suggestion-tag" onclick="selectVaccine('百白破疫苗')">百白破疫苗</span>
                    <span class="suggestion-tag" onclick="selectVaccine('麻疹疫苗')">麻疹疫苗</span>
                    <span class="suggestion-tag" onclick="selectVaccine('乙脑疫苗')">乙脑疫苗</span>
                    <span class="suggestion-tag" onclick="selectVaccine('A群流脑疫苗')">A群流脑疫苗</span>
                    <span class="suggestion-tag" onclick="selectVaccine('甲肝疫苗')">甲肝疫苗</span>
                    <span class="suggestion-tag" onclick="selectVaccine('水痘疫苗')">水痘疫苗</span>
                    <span class="suggestion-tag" onclick="selectVaccine('肺炎疫苗')">肺炎疫苗</span>
                    <span class="suggestion-tag" onclick="selectVaccine('流感疫苗')">流感疫苗</span>
                    <span class="suggestion-tag" onclick="selectVaccine('轮状病毒疫苗')">轮状病毒疫苗</span>
                </div>
            </div>
            
            <form action="/vaccine/add/{{ baby.id }}" method="post">
                <div class="form-group">
                    <label for="vaccine_name">疫苗名称 <span class="required">*</span></label>
                    <input type="text" id="vaccine_name" name="vaccine_name" required placeholder="请输入疫苗名称">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="vaccine_date">接种日期 <span class="required">*</span></label>
                        <input type="date" id="vaccine_date" name="vaccine_date" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="dose">剂次 <span class="optional">(选填)</span></label>
                        <input type="text" id="dose" name="dose" placeholder="例如: 第1针 / 第2针">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="reaction">接种反应 <span class="optional">(选填)</span></label>
                    <textarea id="reaction" name="reaction" placeholder="记录接种后的反应，如：轻微发热、红肿等..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="next_due_date">下次接种日期 <span class="optional">(选填)</span></label>
                    <input type="date" id="next_due_date" name="next_due_date">
                </div>
                
                <div class="form-group">
                    <label for="notes">备注 <span class="optional">(选填)</span></label>
                    <textarea id="notes" name="notes" placeholder="其他备注信息..."></textarea>
                </div>
                
                <div class="btn-group">
                    <a href="/baby/{{ baby.id }}" class="btn btn-secondary">取消</a>
                    <button type="submit" class="btn btn-primary">保存记录</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // 设置默认日期为今天
        document.getElementById('vaccine_date').valueAsDate = new Date();
        
        // 快速选择疫苗
        function selectVaccine(name) {
            document.getElementById('vaccine_name').value = name;
        }
    </script>
</body>
</html>
