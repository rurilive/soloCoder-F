{% extends "base.html" %}

{% block title %}注册 - 二维码追踪系统{% endblock %}

{% block content %}
    <div class="card" style="max-width: 500px; margin: 0 auto;">
        <div class="card-header">
            <h2>用户注册</h2>
        </div>
        <form action="{{ url_for('main.register') }}" method="POST">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" placeholder="请输入邮箱地址" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码（至少6位）" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">确认密码</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="请再次输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">注册</button>
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <p>已有账号？<a href="{{ url_for('main.login') }}" style="color: #667eea; text-decoration: none; font-weight: 500;">立即登录</a></p>
        </div>
    </div>
{% endblock %}
