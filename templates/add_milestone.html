<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记录成长里程碑 - 幼儿成长记录系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .required {
            color: #e53935;
        }
        
        .optional {
            color: #999;
            font-weight: normal;
        }
        
        .milestone-suggestions {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .milestone-suggestions h4 {
            margin-bottom: 10px;
            color: #667eea;
        }
        
        .suggestion-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        
        .suggestion-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            cursor: pointer;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .suggestion-item:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .category-info {
            background: #e8f5e9;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/baby/{{ baby.id }}" class="back-btn">← 返回宝宝详情</a>
        
        <div class="header">
            <h1>⭐ 记录成长里程碑</h1>
            <p>记录 {{ baby.name }} 成长中的珍贵时刻</p>
        </div>
        
        <div class="form-card">
            <div class="milestone-suggestions">
                <h4>💡 常用里程碑（点击快速选择）</h4>
                <div class="suggestion-grid">
                    <div class="suggestion-item" onclick="selectMilestone('第一次笑', '社交')">第一次笑</div>
                    <div class="suggestion-item" onclick="selectMilestone('第一次翻身', '运动')">第一次翻身</div>
                    <div class="suggestion-item" onclick="selectMilestone('第一次独坐', '运动')">第一次独坐</div>
                    <div class="suggestion-item" onclick="selectMilestone('第一次爬行', '运动')">第一次爬行</div>
                    <div class="suggestion-item" onclick="selectMilestone('第一次站立', '运动')">第一次站立</div>
                    <div class="suggestion-item" onclick="selectMilestone('第一次走路', '运动')">第一次走路</div>
                    <div class="suggestion-item" onclick="selectMilestone('第一次说话', '语言')">第一次说话</div>
                    <div class="suggestion-item" onclick="selectMilestone('叫爸爸妈妈', '语言')">叫爸爸妈妈</div>
                    <div class="suggestion-item" onclick="selectMilestone('第一次长牙', '运动')">第一次长牙</div>
                    <div class="suggestion-item" onclick="selectMilestone('第一次吃饭', '运动')">第一次吃饭</div>
                    <div class="suggestion-item" onclick="selectMilestone('认识颜色', '认知')">认识颜色</div>
                    <div class="suggestion-item" onclick="selectMilestone('自己穿衣服', '运动')">自己穿衣服</div>
                </div>
            </div>
            
            <div class="category-info">
                📌 分类说明：<br>
                • 语言：说话、叫人、表达等<br>
                • 运动：翻身、坐、爬、走、跑等<br>
                • 社交：微笑、互动、分享等<br>
                • 认知：认识事物、理解概念等
            </div>
            
            <form action="/milestone/add/{{ baby.id }}" method="post">
                <div class="form-group">
                    <label for="title">里程碑名称 <span class="required">*</span></label>
                    <input type="text" id="title" name="title" required placeholder="例如：第一次说话、第一次走路">
                </div>
                
                <div class="form-group">
                    <label for="description">详细描述 <span class="optional">(选填)</span></label>
                    <textarea id="description" name="description" placeholder="详细描述这个里程碑的情况..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="milestone_date">发生日期 <span class="required">*</span></label>
                    <input type="date" id="milestone_date" name="milestone_date" required>
                </div>
                
                <div class="form-group">
                    <label for="category">分类 <span class="required">*</span></label>
                    <select id="category" name="category" required>
                        <option value="">请选择分类</option>
                        <option value="语言">🗣️ 语言</option>
                        <option value="运动">🏃 运动</option>
                        <option value="社交">🤝 社交</option>
                        <option value="认知">🧠 认知</option>
                        <option value="其他">📝 其他</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="notes">备注 <span class="optional">(选填)</span></label>
                    <textarea id="notes" name="notes" placeholder="其他备注信息..."></textarea>
                </div>
                
                <div class="btn-group">
                    <a href="/baby/{{ baby.id }}" class="btn btn-secondary">取消</a>
                    <button type="submit" class="btn btn-primary">保存记录</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // 设置默认日期为今天
        document.getElementById('milestone_date').valueAsDate = new Date();
        
        // 快速选择里程碑
        function selectMilestone(title, category) {
            document.getElementById('title').value = title;
            document.getElementById('category').value = category;
        }
    </script>
</body>
</html>
