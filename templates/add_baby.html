<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加新宝宝 - 幼儿成长记录系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .required {
            color: #e53935;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👶 添加新宝宝</h1>
        </div>
        
        <div class="form-card">
            <form action="/baby/add" method="post">
                <div class="form-group">
                    <label for="name">宝宝姓名 <span class="required">*</span></label>
                    <input type="text" id="name" name="name" required placeholder="请输入宝宝姓名">
                </div>
                
                <div class="form-group">
                    <label for="gender">性别 <span class="required">*</span></label>
                    <select id="gender" name="gender" required>
                        <option value="">请选择性别</option>
                        <option value="男">男孩 👦</option>
                        <option value="女">女孩 👧</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="birth_date">出生日期 <span class="required">*</span></label>
                    <input type="date" id="birth_date" name="birth_date" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="birth_weight">出生体重 (kg) <span class="required">*</span></label>
                        <input type="number" id="birth_weight" name="birth_weight" step="0.01" min="0.5" max="10" required placeholder="例如: 3.5">
                    </div>
                    
                    <div class="form-group">
                        <label for="birth_height">出生身高 (cm) <span class="required">*</span></label>
                        <input type="number" id="birth_height" name="birth_height" step="0.1" min="20" max="80" required placeholder="例如: 50">
                    </div>
                </div>
                
                <div class="btn-group">
                    <a href="/" class="btn btn-secondary">返回</a>
                    <button type="submit" class="btn btn-primary">添加宝宝</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
