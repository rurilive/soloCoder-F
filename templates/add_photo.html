<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传照片 - 幼儿成长记录系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        
        .form-group input[type="text"],
        .form-group input[type="date"],
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input[type="text"]:focus,
        .form-group input[type="date"]:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .file-upload {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        .file-upload:hover {
            border-color: #667eea;
            background: #f5f5ff;
        }
        
        .file-upload.dragover {
            border-color: #667eea;
            background: #f0f0ff;
        }
        
        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .upload-text {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        
        .upload-hint {
            color: #999;
            font-size: 0.9em;
        }
        
        .file-input {
            display: none;
        }
        
        .preview-container {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
        }
        
        .preview-container.active {
            display: block;
        }
        
        .preview-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            display: block;
            margin: 0 auto 10px;
        }
        
        .preview-info {
            text-align: center;
            color: #666;
            font-size: 0.95em;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .required {
            color: #e53935;
        }
        
        .optional {
            color: #999;
            font-weight: normal;
        }
        
        .album-info {
            background: #e8f5e9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .album-info-title {
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 5px;
        }
        
        .album-info-text {
            color: #388e3c;
            font-size: 0.95em;
        }
        
        .tag-hint {
            color: #999;
            font-size: 0.85em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/album/{{ album.id }}" class="back-btn">← 返回相册</a>
        
        <div class="header">
            <h1>📷 上传照片</h1>
            <p>为 {{ baby.name }} 的相册添加新照片</p>
        </div>
        
        <div class="form-card">
            <div class="album-info">
                <div class="album-info-title">上传到相册</div>
                <div class="album-info-text">{{ album.name }}{% if album.description %} - {{ album.description }}{% endif %}</div>
            </div>
            
            <form action="/photo/add/{{ album.id }}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label>选择照片 <span class="required">*</span></label>
                    <div class="file-upload" id="dropZone">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">点击选择照片或拖拽到此处</div>
                        <div class="upload-hint">支持 JPEG、PNG、GIF、WebP 格式</div>
                        <input type="file" id="photoInput" name="photo" class="file-input" accept="image/jpeg,image/png,image/gif,image/webp" required>
                    </div>
                    <div class="preview-container" id="previewContainer">
                        <div class="preview-title">照片预览</div>
                        <img id="previewImage" class="preview-image" src="" alt="预览">
                        <div class="preview-info" id="previewInfo"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="description">照片描述 <span class="optional">(选填)</span></label>
                    <textarea id="description" name="description" placeholder="描述这张照片的内容..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="photo_date">拍摄日期 <span class="optional">(选填)</span></label>
                    <input type="date" id="photo_date" name="photo_date">
                </div>
                
                <div class="form-group">
                    <label for="tags">标签 <span class="optional">(选填)</span></label>
                    <input type="text" id="tags" name="tags" placeholder="多个标签用逗号分隔">
                    <div class="tag-hint">例如：满月, 第一次笑, 外出游玩</div>
                </div>
                
                <div class="btn-group">
                    <a href="/album/{{ album.id }}" class="btn btn-secondary">取消</a>
                    <button type="submit" class="btn btn-primary" id="submitBtn" disabled>上传照片</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        const dropZone = document.getElementById('dropZone');
        const photoInput = document.getElementById('photoInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const previewInfo = document.getElementById('previewInfo');
        const submitBtn = document.getElementById('submitBtn');
        
        document.getElementById('photo_date').valueAsDate = new Date();
        
        dropZone.addEventListener('click', () => {
            photoInput.click();
        });
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                photoInput.files = files;
                handleFileSelect(files[0]);
            }
        });
        
        photoInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });
        
        function handleFileSelect(file) {
            const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
            if (!allowedTypes.includes(file.type)) {
                alert('只支持 JPEG、PNG、GIF、WebP 格式的图片');
                photoInput.value = '';
                previewContainer.classList.remove('active');
                submitBtn.disabled = true;
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewInfo.textContent = `${file.name} (${formatFileSize(file.size)})`;
                previewContainer.classList.add('active');
                submitBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
